services:
  api:
    build: .
    image: iso6346-adjudication:latest
    ports:
      - "8000:8000"
    environment:
      # 配置项（均可缺省，见 README）
      DB_PATH: /data/adjudication.db
      ENFORCE_OWNER_REGISTRY: "false"
      CATEGORY_LETTERS: "UJZ"
      TOP_K: "20"
      HOST: "0.0.0.0"
      PORT: "8000"
    volumes:
      - adjudication-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  adjudication-data:
